server:
  port: 8081
spring:
  application:
    name: nearbite
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${NEARBITE_DB_URL:jdbc:mysql://localhost:3306/nearbite?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${NEARBITE_DB_USERNAME:root}
    password: ${NEARBITE_DB_PASSWORD:nearbite_dev}
  redis:
    host: ${NEARBITE_REDIS_HOST:localhost}
    port: ${NEARBITE_REDIS_PORT:6379}
    password: ${NEARBITE_REDIS_PASSWORD:}
    database: ${NEARBITE_REDIS_DATABASE:0}
    timeout: 3s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.nearbite.entity # 别名扫描包
logging:
  level:
    com.nearbite: debug
  pattern:
    dateformat: HH:mm:ss.SSS
